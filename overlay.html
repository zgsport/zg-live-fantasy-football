<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZG Live Overlay</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;color:#fff;font-family:Inter,Arial,sans-serif;overflow:hidden}.stage{width:100%;height:100%;display:flex;align-items:flex-end;justify-content:center;padding:3vh 3vw}.card{width:min(100%,1000px);background:linear-gradient(120deg,rgba(7,12,24,.96),rgba(16,29,49,.94));border:2px solid #b9ff45;border-radius:22px;padding:22px 28px;box-shadow:0 10px 35px #0008;opacity:0;transform:translateY(16px);transition:opacity .3s,transform .3s}.card.show{opacity:1;transform:translateY(0)}.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;color:#b9ff45;font-size:clamp(14px,2vw,22px);font-weight:900;letter-spacing:.08em;text-transform:uppercase}.tag{background:#b9ff45;color:#10150a;border-radius:999px;padding:5px 11px;font-size:.72em}.user{font-size:clamp(20px,3.2vw,34px);font-weight:900;margin:12px 0 6px;overflow-wrap:anywhere}.question{font-size:clamp(18px,2.8vw,31px);font-weight:650;line-height:1.3;overflow-wrap:anywhere;white-space:pre-wrap}.answer{border-top:1px solid #40506b;margin-top:14px;padding-top:12px;color:#d5ff9b;font-size:clamp(16px,2.3vw,25px);white-space:pre-wrap;overflow-wrap:anywhere}.hint{position:absolute;top:12px;left:16px;font-size:11px;color:#ffffff80;letter-spacing:.12em}.empty{font-size:20px;color:#fff9}
</style></head><body><div class="hint">ZG LIVE · BROWSER OVERLAY</div><main class="stage"><section class="card" id="card"><div class="top"><span>ZG LIVE</span><span class="tag" id="type">START / SIT</span><span class="tag">FANTASY FOOTBALL</span></div><div class="user" id="user"></div><div class="question" id="question"></div><div class="answer" id="answer"></div></section></main><script>
const key=new URLSearchParams(location.search).get('key')||'';let current=null;async function tick(){try{const r=await fetch('/api/overlay/current'+(key?'?key='+encodeURIComponent(key):''),{cache:'no-store'});if(!r.ok)throw Error('overlay unavailable');const q=await r.json();if(!q){document.querySelector('#card').classList.remove('show');current=null;return}if(!current||q.id!==current.id||q.answer!==current.answer||q.status!==current.status){current=q;document.querySelector('#type').textContent=q.type==='trade'?'TRADE ADVICE':'START / SIT';document.querySelector('#user').textContent='QUESTION FROM '+q.username;document.querySelector('#question').textContent=q.details;document.querySelector('#answer').textContent=q.answer||'';document.querySelector('#answer').style.display=q.answer?'block':'none';document.querySelector('#card').classList.add('show')}}catch(e){document.querySelector('#card').classList.remove('show')}}tick();setInterval(tick,1800);
</script></body></html>
