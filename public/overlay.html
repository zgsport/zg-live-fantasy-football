<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZG — Stream Overlay</title><link rel="stylesheet" href="/style.css"></head><body class="overlay-body"><main class="overlay-shell"><div class="overlay-brand"><span class="brand-ball">ZG</span><span>FANTASY FOOTBALL</span><span class="live-pill">● LIVE Q&amp;A</span></div><section class="overlay-hero"><p class="eyebrow">THE CHAT DECIDES</p><h1>START <em>OR</em> SIT?</h1><p>Fantasy questions, answered live.</p></section><div id="overlayQuestions" class="overlay-questions"><div class="overlay-empty"><div class="pulse">●</div><h2>YOUR QUESTION COULD BE NEXT</h2><p>Submit at <strong>ask.zg.live</strong></p></div></div><footer class="overlay-footer"><span>ASK.ZG.LIVE</span><span>SUBMIT • WATCH • WIN YOUR WEEK</span></footer></main>
<script src="/socket.io/socket.io.js"></script><script>
const root=document.getElementById("overlayQuestions");const esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function render(qs){if(!qs.length){root.innerHTML='<div class="overlay-empty"><div class="pulse">●</div><h2>YOUR QUESTION COULD BE NEXT</h2><p>Submit at <strong>ask.zg.live</strong></p></div>';return;}root.innerHTML=qs.map((q,i)=>`<article class="overlay-card ${i===0?'featured':''}"><div class="overlay-card-top"><span class="tag">${q.type==='trade'?'TRADE ANALYZER':'START / SIT'}</span><span class="overlay-number">QUESTION #${q.id}</span></div><h2>${esc(q.displayName||'TikTok viewer')}</h2>${q.players?`<div class="overlay-players">${esc(q.players)}</div>`:''}<p>${esc(q.question)}</p>${q.answer?`<div class="overlay-answer"><span>ZG'S TAKE</span><p>${esc(q.answer)}</p></div>`:''}</article>`).join("");}
const socket=io();socket.on("overlay:update",render);
</script></body></html>
